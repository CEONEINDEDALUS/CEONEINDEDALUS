<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dedalus terminal banner">
  <title>dedalus@127.0.0.1 — whoami</title>

  <defs>
    <!-- red micro grid -->
    <pattern id="gridP" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF1001" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <!-- vignette -->
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- scan beam -->
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1001" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FF1001" stop-opacity="0"/>
    </linearGradient>
    <!-- typewriter reveal clips -->
    <clipPath id="clipL1"><rect x="70" y="88" width="116" height="34">
      <animate attributeName="width" values="0;116" begin="0.05s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
    </rect></clipPath>
    <clipPath id="clipL3"><rect x="70" y="176" width="240" height="34">
      <animate attributeName="width" values="0;240" begin="1.15s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
    </rect></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#0A0A0A"/>
  <rect width="1200" height="320" fill="url(#gridP)"/>

  <!-- corner brackets -->
  <g stroke="#FF1001" stroke-width="3.5" fill="none" stroke-opacity="0.9">
    <path d="M 12 44 V 12 H 44"/>
    <path d="M 1156 12 H 1188 V 44"/>
    <path d="M 12 276 V 308 H 44"/>
    <path d="M 1188 276 V 308 H 1156"/>
  </g>

  <!-- terminal window -->
  <rect x="40" y="34" width="1120" height="252" rx="12" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="1.5"/>
  <path d="M 40 86 V 46 Q 40 34 52 34 H 1148 Q 1160 34 1160 46 V 86 Z" fill="#161616"/>
  <line x1="40" y1="86.5" x2="1160" y2="86.5" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- traffic dots -->
  <circle cx="70" cy="60" r="7" fill="#FF5F56" fill-opacity="0.9"/>
  <circle cx="92" cy="60" r="7" fill="#FFBD2E" fill-opacity="0.9"/>
  <circle cx="114" cy="60" r="7" fill="#27C93F" fill-opacity="0.9"/>

  <!-- window title -->
  <text x="600" y="65" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace" font-size="15" fill="#9A9A9A" letter-spacing="1">dedalus@127.0.0.1 : ~/team-dedalus (zsh)</text>

  <!-- terminal lines -->
  <g font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace" font-size="22">
    <!-- line 1: typed command -->
    <g clip-path="url(#clipL1)">
      <text x="76" y="112" fill="#EAEAEA"><tspan fill="#FF1001" font-weight="bold">$</tspan> whoami</text>
    </g>
    <!-- line 2: output (appears) -->
    <text x="100" y="152" fill="#EAEAEA">
      -&gt; Ceonein Dedalus <tspan fill="#FF1001">·</tspan> Team Dedalus <tspan fill="#FF1001">·</tspan> 127.0.0.1
      <animate attributeName="opacity" values="0;0" begin="0.05s" dur="0.75s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" begin="0.85s" dur="0.12s" fill="freeze"/>
    </text>
    <!-- line 3: typed command -->
    <g clip-path="url(#clipL3)">
      <text x="76" y="200" fill="#EAEAEA"><tspan fill="#FF1001" font-weight="bold">$</tspan> cat mission.txt</text>
    </g>
    <!-- line 4: output (appears) -->
    <text x="100" y="240" fill="#FF1001" font-weight="bold" letter-spacing="3">
      -&gt; PRIVACY · SECURITY · AUTOMATION
      <animate attributeName="opacity" values="0;0" begin="0.05s" dur="1.95s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.12s" fill="freeze"/>
    </text>
  </g>

  <!-- right side status chips -->
  <g font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace" font-size="15" text-anchor="end">
    <text x="1140" y="112" fill="#FF1001">[ NO CLOUD ]</text>
    <text x="1140" y="136" fill="#6E6E6E">[ LOCAL ONLY ]</text>
  </g>

  <!-- cursors -->
  <rect x="184" y="92" width="14" height="26" fill="#FF1001" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" begin="0.05s" dur="0.55s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" begin="0.62s" dur="0.06s" fill="freeze"/>
  </rect>
  <rect x="303" y="180" width="14" height="26" fill="#FF1001" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" begin="1.15s" dur="0.65s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" begin="1.82s" dur="0.06s" fill="freeze"/>
  </rect>
  <rect x="656" y="220" width="14" height="26" fill="#FF1001">
    <animate attributeName="opacity" values="0;0" begin="0.05s" dur="2.25s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" begin="2.3s" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- sweeping scan beam -->
  <rect x="40" y="74" width="1120" height="28" fill="url(#scanG)">
    <animate attributeName="y" values="74;282" begin="0s" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- vignette on top -->
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>

  <!-- footer caption -->
  <text x="600" y="311" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace" font-size="13" fill="#6E6E6E" letter-spacing="2">─── TEAM DEDALUS ── offline-first · open-source · no servers were harmed ───</text>
</svg>
