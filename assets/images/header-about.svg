<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ABOUT ME">
  <title>ABOUT ME</title>
  <defs>
    <pattern id="hgrid-about" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#FF1001" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="hclip-about"><rect x="126" y="40" width="273" height="56">
      <animate attributeName="width" values="0;273" begin="0.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
    </rect></clipPath>
  </defs>

  <!-- panel -->
  <rect x="6" y="8" width="888" height="134" rx="14" fill="#0C0C0C" stroke="#FF1001" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="6" y="8" width="888" height="134" rx="14" fill="url(#hgrid-about)"/>

  <!-- faint background glyph -->
  <text x="800" y="128" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace"
        font-size="140" font-weight="bold" fill="#FFFFFF" fill-opacity="0.045">~</text>

  <!-- prompt chip -->
  <rect x="34" y="41" width="68" height="68" rx="10" fill="#FF1001"/>
  <text x="68" y="86" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace"
        font-size="27" font-weight="bold" fill="#0A0A0A">&gt;_</text>

  <!-- big title (types in) + blinking underscore -->
  <g clip-path="url(#hclip-about)">
    <text x="132" y="79" font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace"
          font-size="44" font-weight="bold" fill="#FFFFFF" letter-spacing="6">ABOUT ME</text>
  </g>
  <rect x="395" y="52" width="22" height="9" fill="#FF1001">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- command line -->
  <text x="134" y="113" font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace" font-size="17">
    <tspan fill="#FF1001">ceonein@127.0.0.1</tspan><tspan fill="#8A8A8A">:~$ </tspan><tspan fill="#B9B9B9">cat whoami.txt</tspan>
  </text>

  <!-- right status -->
  <g font-family="JetBrains Mono, Cascadia Mono, Consolas, Courier New, monospace" font-size="16" text-anchor="end">
    <text x="866" y="70" fill="#FF1001">[ OK ]</text>
    <text x="866" y="94" fill="#5A5A5A">v2.0</text>
  </g>

  <!-- deco ticks top-right -->
  <rect x="806" y="20" width="10" height="10" fill="#FF1001" fill-opacity="0.9"/>
  <rect x="822" y="20" width="10" height="10" fill="#FF1001" fill-opacity="0.35"/>
  <rect x="838" y="20" width="10" height="10" fill="#FF1001" fill-opacity="0.9"/>
</svg>
